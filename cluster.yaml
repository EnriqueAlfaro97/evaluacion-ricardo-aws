apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: evaluacion-ricardo
  region: us-east-1
  version: "1.34"

iam:
  withOIDC: true

accessConfig:
  authenticationMode: API_AND_CONFIG_MAP

addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: eks-pod-identity-agent

managedNodeGroups:
  - name: ng-general
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 1
    maxSize: 2
    volumeSize: 20
    labels:
      role: general
    tags:
      proyecto: evaluacion-ricardo